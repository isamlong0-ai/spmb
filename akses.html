<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png">
  <title>Login Admin — SMKN 1 Teluk Keramat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="toastWrap"></div>

  <!-- LOGIN -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <h2>Login Admin</h2>
      <p>Satu akun untuk mengelola Website Sekolah &amp; SPMB.</p>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@..."></div>
      <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" id="btnLogin">Masuk</button>
      <div class="err" id="loginError"></div>
      <div style="text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted)">
        <a href="index.html">Kembali ke beranda</a>
      </div>
    </div>
  </div>

  <!-- CHOOSER -->
  <div id="chooserView" class="hidden" style="display:none">
    <div class="wrap" style="padding-top:40px">
      <a href="index.html" style="font-size:13px;color:var(--muted)">&larr; Kembali ke beranda</a>
      <h2 style="margin-top:12px">Pilih Dashboard</h2>
      <p style="color:var(--muted)">Halo, <strong id="userEmail"></strong>. Pilih modul yang ingin dikelola.</p>
      <div class="dash-grid" id="dashGrid"></div>
      <div style="margin-top:24px">
        <button class="btn btn-outline" id="btnLogout">Keluar</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/idle.js?v=1"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
